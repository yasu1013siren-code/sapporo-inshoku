name: Update Sapporo Inshoku News

on:
  schedule:
    # 00:00 UTC = 09:00 JST（GitHub Actionsのcronは常にUTC表記。実行が数分〜数時間遅れることがあります）
    - cron: "0 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Run collector (10区・複数情報源から自動収集)
        run: python collector_ver71.py

      - name: Commit and push if data changed
        run: |
          git config user.name "sapporo-inshoku-bot"
          git config user.email "actions@users.noreply.github.com"
          # news.json（サイト表示用）と restaurants.db（履歴・重複統合用）だけを追跡する。
          # ログや日付付きCSVはリポジトリを肥大化させるため追跡しない（.gitignore参照）。
          git add news.json data/restaurants.db collector_ver71_report.json
          if git diff --cached --quiet; then
            echo "変更なし。コミットをスキップします。"
          else
            git commit -m "auto: update news.json ($(date -u +'%Y-%m-%dT%H:%M:%SZ') UTC)"
            git push
          fi
