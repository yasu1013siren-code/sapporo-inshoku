const MONTH_NAMES = ["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];
const TYPE_TAG_LABEL = {open:"新規開店", closed:"閉店", upcoming:"開店予定", unknown:"要確認"};

function parseDateLoose(dateStr){
  // "2026-09-01" のような形式のみ日付として解釈。"2026年"等はnullを返す。
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(dateStr);
  if(!m) return null;
  return new Date(Number(m[1]), Number(m[2])-1, Number(m[3]));
}

function eventCardHTML(item, type){
  const d = parseDateLoose(item.date);
  const day = d ? String(d.getDate()).padStart(2,"0") : "?";
  const month = d ? MONTH_NAMES[d.getMonth()] : "日付未定";
  const nameClass = item.name.includes("未詳") ? "unnamed" : "";
  const countdown = type === "upcoming" ? daysUntilLabel(item.date) : "";
  return `<div class="event-card" data-type="${type}">
    <div class="date-badge type-${type}"><span class="day">${day}</span><span class="month">${month}</span></div>
    <div class="event-body">
      <div class="event-tags">
        <span class="tag type-${type}">${TYPE_TAG_LABEL[type]}</span>
        ${countdown ? `<span class="tag countdown">${countdown}</span>` : ""}
      </div>
      <h3 class="${nameClass}">${escapeHTML(item.name)}</h3>
      <div class="meta">${escapeHTML(item.date)}　${escapeHTML(item.place || "")}</div>
      ${item.note ? `<p>${escapeHTML(item.note)}</p>` : ""}
      ${item.source ? (item.url
        ? `<a class="src-link" href="${item.url}" target="_blank" rel="noopener noreferrer">情報源：${escapeHTML(item.source)} ↗</a>`
        : `<span class="tip-src">情報源：${escapeHTML(item.source)}</span>`) : ""}
    </div>
  </div>`;
}

function daysUntilLabel(dateStr){
  const target = parseDateLoose(dateStr);
  if(!target) return "";
  const today = new Date();
  today.setHours(0,0,0,0);
  const diff = Math.round((target - today) / 86400000);
  if(diff < 0) return "";
  if(diff === 0) return "本日OPEN";
  if(diff === 1) return "明日OPEN";
  return `あと${diff}日`;
}

function renderUpcoming(){
  const now = new Date(); now.setHours(0,0,0,0);
  const horizon = new Date(now.getTime() + 65*86400000); // 目安：約2ヶ月
  AREA_META.map(a=>a.id).forEach(area=>{
    const el = document.getElementById(`${area}-upcoming`);
    const items = (UPCOMING[area] || [])
      .filter(i => { const d = parseDateLoose(i.date); return d && d >= now && d <= horizon; })
      .sort((a,b)=> parseDateLoose(a.date) - parseDateLoose(b.date));
    el.innerHTML = items.length
      ? items.map(i=>eventCardHTML(i,"upcoming")).join("")
      : `<p class="empty-note">現在、日付が判明している開店予定情報はありません。</p>`;
  });
}

function escapeHTML(str){
  return String(str).replace(/[&<>"']/g, s => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[s]));
}

function renderHistory(){
  const now = new Date(); now.setHours(0,0,0,0);
  const windowStart = new Date(now.getTime() - 31*86400000);
  const windowEnd = new Date(now.getTime() + 31*86400000);
  AREA_META.map(a=>a.id).forEach(area=>{
    const el = document.getElementById(`${area}-history`);
    const merged = [
      ...(CONFIRMED[area] ? CONFIRMED[area].open.map(i=>({...i, _type:"open"})) : []),
      ...(CONFIRMED[area] ? CONFIRMED[area].closed.map(i=>({...i, _type:"closed"})) : []),
    ].filter(i => {
      const d = parseDateLoose(i.date);
      if(!d) return true; // 日付未定は除外しすぎないよう残す
      return d >= windowStart && d <= windowEnd;
    }).sort((a,b)=>{
      const da = parseDateLoose(a.date), db = parseDateLoose(b.date);
      if(da && db) return db - da; // 新しい日付が上
      if(da) return -1;
      if(db) return 1;
      return 0;
    });
    el.innerHTML = merged.length
      ? merged.map(i=>eventCardHTML(i, i._type)).join("")
      : `<p class="empty-note">直近1ヶ月で確認できている情報はありません。</p>`;
  });
}

// ---------------- 最新ニュース速報（GitHub Actionsが自動生成する news.json を読み込む） ----------------
function newsItemHTML(item){
  const d = parseDateLoose(item.date);
  const day = d ? String(d.getDate()).padStart(2,"0") : "?";
  const month = d ? MONTH_NAMES[d.getMonth()] : "日付未定";
  // typeが「unknown」（新スクリプトでは判定できた場合そのままopen/closed/upcomingが入る）の場合のみ「自動判定」と明示
  const guessedType = item.type && TYPE_TAG_LABEL[item.type] ? item.type : "unknown";
  const badgeType = guessedType === "unknown" ? "news" : guessedType;
  const sourceCount = item.source_count || (Array.isArray(item.sources) ? item.sources.length : 1);
  const multiSourceNote = sourceCount >= 2 ? `<span class="tag area-tag">${sourceCount}媒体で確認</span>` : "";
  return `<div class="event-card" data-type="news">
    <div class="date-badge type-${badgeType}"><span class="day">${day}</span><span class="month">${month}</span></div>
    <div class="event-body">
      <div class="event-tags">
        <span class="tag type-${guessedType}">${TYPE_TAG_LABEL[guessedType]}（自動判定）</span>
        ${multiSourceNote}
      </div>
      <h3><a class="src-link" href="${item.url}" target="_blank" rel="noopener noreferrer">${escapeHTML(item.title)} ↗</a></h3>
      ${item.place ? `<p>${escapeHTML(item.place)}</p>` : ""}
    </div>
  </div>`;
}

async function loadAutoNews(){
  const areaIds = AREA_META.map(a=>a.id);
  areaIds.forEach(area=>{
    const el = document.getElementById(`${area}-news`);
    if(el) el.innerHTML = `<p class="empty-note">読み込み中…</p>`;
  });
  try{
    const res = await fetch("news.json", {cache:"no-store"});
    if(!res.ok) throw new Error("news.json の取得に失敗しました");
    const data = await res.json();

    // 表示は「今日から前後1ヶ月」に絞る（日付未定のものは念のため残す）
    const now = new Date(); now.setHours(0,0,0,0);
    const windowStart = new Date(now.getTime() - 31*86400000);
    const windowEnd = new Date(now.getTime() + 31*86400000);
    const inWindow = (item) => {
      const d = parseDateLoose(item.date);
      if(!d) return true; // 日付未定は除外しすぎないよう残す
      return d >= windowStart && d <= windowEnd;
    };

    areaIds.forEach(area=>{
      const el = document.getElementById(`${area}-news`);
      if(!el) return;
      const items = ((data.areas && data.areas[area]) || []).filter(inWindow);
      el.innerHTML = items.length
        ? items.map(newsItemHTML).join("")
        : `<p class="empty-note">この区の自動収集データ（直近1ヶ月分）は現在ありません（対応情報源が無い区もあります）。</p>`;
    });
  }catch(e){
    areaIds.forEach(area=>{
      const el = document.getElementById(`${area}-news`);
      if(el) el.innerHTML = `<p class="empty-note">自動収集データを読み込めませんでした（news.jsonがまだ生成されていない可能性があります）。</p>`;
    });
  }
}

renderHistory();
renderUpcoming();
loadAutoNews();

// ---------------- 自動更新（1時間ごとに開店予定のカウントダウン表示を再計算） ----------------
const REFRESH_INTERVAL_MS = 60 * 60 * 1000; // 1時間
const statusEl = document.getElementById("auto-refresh-status");

function formatClock(d){
  return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}

function autoRefresh(){
  if(statusEl) statusEl.textContent = "自動更新：更新中…";
  renderUpcoming(); // カウントダウン表示（あと◯日）を今日の日付基準で再計算
  loadAutoNews();
  if(statusEl) statusEl.textContent = `自動更新：最終 ${formatClock(new Date())}（1時間ごと）`;
}

if(statusEl) statusEl.textContent = `自動更新：最終 ${formatClock(new Date())}（1時間ごと）`;
setInterval(autoRefresh, REFRESH_INTERVAL_MS);

// タブを切り替えて画面に戻ってきたときにも最新化する
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState === "visible"){
    autoRefresh();
  }
});
